name: Automated Hourly Operational Risk Index Update

on:
  schedule:
    # Runs at the top of every hour (00:00, 01:00, 02:00 UTC...)
    - cron: '0 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI

permissions:
  contents: write

jobs:
  run-ml-inference-and-sync:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install updater dependencies
        run: |
          pip install numpy pandas

      - name: Update prototype index from Open-Meteo model/API data
        run: |
          python SCRIPTS/12_hourly_cloud_updater.py --mode live

      - name: 🚀 Setup Node.js & Build Frontend
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: FRONTEND/package-lock.json

      - name: 🛠️ Install NPM & Build Vite Assets
        run: |
          cd FRONTEND
          npm ci
          npm run build

      - name: Commit validated operational index state
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add FRONTEND/src/data/realRiskData.json FRONTEND/src/data/mockRiskData.js
          if git diff --staged --quiet; then
            echo "No changes in risk levels this hour."
          else
            git commit -m "chore(telemetry): sync Open-Meteo operational index [skip ci]"
            git push
          fi
